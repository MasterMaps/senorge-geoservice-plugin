[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senorge-geoservice-plugin"
version = "0.1.0"
description = "seNorge 2018 daily temperature and precipitation as an installable Open Geo Service plugin."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{ name = "DHIS2 for Climate & Health" }]
keywords = ["open-geo-service", "senorge", "climate", "dhis2"]
dependencies = [
    "open-geo-service",
]

[project.urls]
Homepage = "https://github.com/MasterMaps/senorge-geoservice-plugin"
"Open Geo Service" = "https://github.com/dhis2/open-geo-service"

# Auto-discovered by Open Geo Service (dhis2/open-geo-service#118): the value
# is this plugin's top-level import package. Open Geo Service loads its rasters/*.yaml templates,
# and imports the ingestion plugin class by its dotted path at ingest time.
[project.entry-points."open_geo_service.plugins"]
senorge = "senorge_geoservice_plugin"

# `open-geo-service` is declared as a bare dependency with no VCS source pin: a
# plugin must not dictate which Open Geo Service revision an instance runs — the consuming instance
# supplies the source (git branch/tag/PyPI) via its own [tool.uv.sources]. (For local
# dev/CI of this plugin alone, install Open Geo Service explicitly, e.g. `uv pip install
# "open-geo-service @ git+https://github.com/dhis2/open-geo-service.git".)

[tool.hatch.build.targets.wheel]
packages = ["senorge_geoservice_plugin"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]
